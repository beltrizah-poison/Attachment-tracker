<!DOCTYPE html>
<html>
    <head>
        <meta charset="UTF-8">
        <meta name="viewport" content="width=device-width, intial-scale=1.0">
        <title>Attachment Track</title>
        <link rel="stylesheet" href="style.css">
    </head>
    <body>
        <header>
            <h1>ATTACHMENT TRACK</h1>
            <p>Industrial Attachment Application Tracker</p>
        </header>
        <main>
            <section class="summary">
                <div>
                    <h3>Total Applications</h3>
                    <p id="totalApplications">0</p>
                </div>
                <div>
                    <h3>Interviews</h3>
                    <p id="interviews">0</p>
                </div>
                <div>
                    <h3>Accepted</h3>
                    <p id="accepted">0</p>
                </div>
            </section>
            <section class="application-form">
                <h2>Add Application</h2>
                <form id="applicationForm">
                    <label for="company">Company Name</label>
                    <input type="text" id="company" required><br><br>
                    <label for="position">Position/ Attachment Area</label>
                    <input type="text" id="position" required><br><br>
                    <label for="location">Location</label>
                    <input type="text" id="location" required><br><br>
                    <label for="date">Application Date</label>
                    <input type="date" id="date" required><br><br>
                    <label for="status">Status</label>
                    <select id="status">
                        <option>Applied</option>
                        <option>Interview</option>
                        <option>Accepted</option>
                        <option>Rejected</option>
                    </select><br><br>
                    <label for="notes">Notes</label>
                    <textarea id="notes" rows="4"></textarea><br><br>
                    <button type="submit">Add Application</button>
                </form>
            </section>
            <section class="application">
                <h2>My Application</h2>
                <div id="applicationList">
                    
                </div>
            </section>
        </main>
        <script src="script.js"></script>
    </body>
</html>
